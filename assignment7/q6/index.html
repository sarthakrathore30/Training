<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Transformations Showcase</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CSS Transformations Showcase</h1>
  </header>

  <main class="transform-row">
    <div class="transform-item">
      <div class="transform-box rotate-box">Rotate</div>
      <p class="label">rotate(45deg)</p>
    </div>

    <div class="transform-item">
      <div class="transform-box scale-box">Scale</div>
      <p class="label">scale(1.3)</p>
    </div>

    <div class="transform-item">
      <div class="transform-box translate-box">Translate</div>
      <p class="label">translateY(-15px)</p>
    </div>

    <div class="transform-item">
      <div class="transform-box skew-box">Skew</div>
      <p class="label">skew(15deg)</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Transformations Showcase</p>
  </footer>
</body>
</html>
