<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadows and Depth</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Shadows &amp; Depth Effects</h1>
  </header>

  <main class="card-row">
    <section class="depth-card card-soft">
      <h2>Soft Shadow</h2>
      <p>A gentle, diffused shadow for a subtle raised feel.</p>
    </section>

    <section class="depth-card card-hard">
      <h2>Hard Shadow</h2>
      <p>A crisp, offset shadow that creates a bolder depth effect.</p>
    </section>

    <section class="depth-card card-colored">
      <h2>Colored Shadow</h2>
      <p>A tinted shadow that matches the card's accent color.</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Depth &amp; Shadows</p>
  </footer>
</body>
</html>
