<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borders and Padding Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Borders &amp; Padding Demonstration</h1>
  </header>

  <main class="box-row">
    <section class="demo-box solid-box">
      <h2>Solid</h2>
      <p>border: 3px solid</p>
    </section>

    <section class="demo-box dashed-box">
      <h2>Dashed</h2>
      <p>border: 3px dashed</p>
    </section>

    <section class="demo-box double-box">
      <h2>Double</h2>
      <p>border: 6px double</p>
    </section>

    <section class="demo-box groove-box">
      <h2>Groove</h2>
      <p>border: 6px groove</p>
    </section>

    <section class="demo-box rounded-box">
      <h2>Rounded</h2>
      <p>border-radius: 20px</p>
    </section>

    <section class="demo-box padded-box">
      <h2>Extra Padding</h2>
      <p>padding: 2.5rem</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 CSS Practice Pages</p>
  </footer>
</body>
</html>
