<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="gallery-header">
    <h1>Photo Gallery</h1>
  </header>

  <main class="gallery-grid">
    <figure class="gallery-item">
      <div class="photo" style="background-color:#f87171;"></div>
      <figcaption>Sunset Hills</figcaption>
    </figure>
    <figure class="gallery-item">
      <div class="photo" style="background-color:#fb923c;"></div>
      <figcaption>Desert Road</figcaption>
    </figure>
    <figure class="gallery-item">
      <div class="photo" style="background-color:#facc15;"></div>
      <figcaption>Golden Field</figcaption>
    </figure>
    <figure class="gallery-item">
      <div class="photo" style="background-color:#4ade80;"></div>
      <figcaption>Forest Trail</figcaption>
    </figure>
    <figure class="gallery-item">
      <div class="photo" style="background-color:#38bdf8;"></div>
      <figcaption>Ocean View</figcaption>
    </figure>
    <figure class="gallery-item">
      <div class="photo" style="background-color:#818cf8;"></div>
      <figcaption>Night Sky</figcaption>
    </figure>
  </main>
</body>
</html>
