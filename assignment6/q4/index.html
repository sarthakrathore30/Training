<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <header class="dash-header">
      <h1>Dashboard</h1>
    </header>

    <aside class="sidebar">
      <nav>
        <a href="#overview">Overview</a>
        <a href="#reports">Reports</a>
        <a href="#analytics">Analytics</a>
        <a href="#settings">Settings</a>
      </nav>
    </aside>

    <main class="dash-main">
      <div class="dash-box wide">
        <h2>Revenue Overview</h2>
        <p>A summary of revenue trends spanning the last two quarters.</p>
      </div>
      <div class="dash-box">
        <h2>Active Users</h2>
        <p>1,204 users online now.</p>
      </div>
      <div class="dash-box">
        <h2>New Signups</h2>
        <p>58 new signups today.</p>
      </div>
      <div class="dash-box">
        <h2>Support Tickets</h2>
        <p>12 open tickets awaiting response.</p>
      </div>
    </main>
  </div>
</body>
</html>
