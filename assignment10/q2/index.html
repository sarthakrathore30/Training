<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aarav Sharma — Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">

  <!-- Header -->
  <header class="text-center py-5 bg-white">
    <div class="container">
      <!-- rounded-circle + img-fluid profile image -->
      <img src="https://placehold.co/160x160/278ea5/ffffff?text=AS" alt="Profile photo of Aarav Sharma" class="img-fluid rounded-circle mb-3 shadow">
      <h1 class="fw-bold mt-3">Aarav Sharma</h1>
      <p class="lead text-muted">Frontend Developer &amp; UI Designer</p>
    </div>
  </header>

  <main>
    <!-- Buttons section -->
    <section class="text-center mt-4 mb-3">
      <div class="container">
        <a href="#contact" class="btn btn-primary mx-2 mb-2">Hire Me</a>
        <a href="#" class="btn btn-outline-secondary mx-2 mb-2">Download CV</a>
      </div>
    </section>

    <!-- About / spacing utility demo -->
    <section class="container p-5 my-4 bg-white rounded shadow-sm text-center">
      <h2 class="fw-bold mb-3">About Me</h2>
      <p>I build clean, responsive web experiences using modern tools like Bootstrap, React,
        and Figma. I love turning ideas into pixel-perfect interfaces.</p>
    </section>

    <!-- Contact form -->
    <section id="contact" class="container mb-5">
      <div class="p-4 bg-white rounded shadow-sm">
        <h2 class="text-center fw-bold mb-4">Get In Touch</h2>
        <form>
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Your name">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="you@example.com">
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="4" placeholder="Say hello..."></textarea>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-primary px-4">Send Message</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2026 Aarav Sharma</p>
  </footer>

</body>
</html>
