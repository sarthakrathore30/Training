<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanCart — Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="bg-dark text-white text-center py-4">
    <h1 class="mb-0">UrbanCart</h1>
    <p class="mb-0 text-secondary">Everyday essentials, delivered fast</p>
  </header>

  <main class="container my-5">
    <h2 class="text-center mb-4">Featured Products</h2>

    <!-- 4 columns on desktop (col-md-3), 2 on tablet (col-sm-6), 1 on mobile (col-12) -->
    <div class="row g-4">

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 product-card shadow-sm">
          <img src="https://placehold.co/300x200/eeeeee/333333?text=Sneakers" class="card-img-top" alt="Running sneakers">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Running Sneakers</h5>
            <p class="card-text fw-bold">$59.99</p>
            <button class="btn btn-primary mt-auto">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 product-card shadow-sm">
          <img src="https://placehold.co/300x200/eeeeee/333333?text=Backpack" class="card-img-top" alt="Travel backpack">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Travel Backpack</h5>
            <p class="card-text fw-bold">$39.50</p>
            <button class="btn btn-primary mt-auto">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 product-card shadow-sm">
          <img src="https://placehold.co/300x200/eeeeee/333333?text=Headphones" class="card-img-top" alt="Wireless headphones">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Wireless Headphones</h5>
            <p class="card-text fw-bold">$89.00</p>
            <button class="btn btn-primary mt-auto">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 product-card shadow-sm">
          <img src="https://placehold.co/300x200/eeeeee/333333?text=Watch" class="card-img-top" alt="Smart watch">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Smart Watch</h5>
            <p class="card-text fw-bold">$120.00</p>
            <button class="btn btn-primary mt-auto">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2026 UrbanCart</p>
  </footer>

</body>
</html>
