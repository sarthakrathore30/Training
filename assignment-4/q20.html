<!DOCTYPE html>
<html>
<head>

    <!-- Defines the title shown in the browser tab -->
    <title>Important Head Elements</title>

    <!-- Specifies character encoding -->
    <meta charset="UTF-8">

    <!-- Provides page description -->
    <meta name="description" content="HTML Head Elements Example">

    <!-- Specifies author name -->
    <meta name="author" content="Sarthak Singh Rathore">

    <!-- Sets the base URL for all relative links -->
    <base href="https://example.com/">

    <!-- Links an external favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- Internal CSS can be written here -->
    <style>

    </style>

    <!-- JavaScript can be written here -->
    <script>

    </script>

</head>
<body>

    <h2>HTML Head Elements Example</h2>

    <p>This page demonstrates commonly used head tags in HTML.</p>

</body>
</html>
