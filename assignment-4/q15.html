<!DOCTYPE html>
<html>
<head>
    <title>Payment Form</title>
</head>
<body>

    <h2>Payment Form</h2>

    <form>

        Cardholder Name:<br>
        <input type="text" required><br><br>

        Card Number:<br>
        <input type="text" required><br><br>

        Expiry Date:<br>
        <input type="month" required><br><br>

        CVV:<br>
        <input type="password" maxlength="3" required><br><br>

        <input type="submit" value="Pay Now">

    </form>

</body>
</html>
