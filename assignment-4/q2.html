<!DOCTYPE html>
<html>
<head>
    <title>Google Map Embed</title>
</head>
<body>

    <h2>GLA University, Mathura</h2>

    <!-- loading="lazy" delays loading the iframe until it is near the viewport. -->
    <iframe
        title="GLA University Map"
        src="https://maps.google.com/maps?q=GLA%20University%20Mathura&t=&z=15&ie=UTF8&iwloc=&output=embed"
        width="100%"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
