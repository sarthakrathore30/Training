<!DOCTYPE html>
<html>
<head>
    <title>Secure Form</title>
</head>
<body>

    <h2>Secure Login Form</h2>

    <form autocomplete="off">

        Username:<br>
        <input type="text" required><br><br>

        Password:<br>
        <input type="password" required><br><br>

        <input type="submit" value="Login">

    </form>

    <p>
        Turning off autocomplete helps prevent browsers from automatically
        filling sensitive information on shared or public computers.
    </p>

</body>
</html>
