<!DOCTYPE html>
<html>
<head>
    <title>User Registration Form</title>
</head>
<body>

    <h2>User Registration</h2>

    <form>

        Full Name:<br>
        <input type="text" required><br><br>

        Email Address:<br>
        <input type="email" required><br><br>

        Password:<br>
        <input type="password" required><br><br>

        Confirm Password:<br>
        <input type="password" required><br><br>

        <input type="submit" value="Register">

    </form>

</body>
</html>
