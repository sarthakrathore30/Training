<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
</head>
<body>

    <h2>Contact Us</h2>

    <form>

        Full Name:<br>
        <input type="text" placeholder="Enter your full name" required><br><br>

        Email:<br>
        <input type="email" placeholder="Enter your email" required><br><br>

        Subject:<br>
        <input type="text" placeholder="Enter subject" required><br><br>

        Message:<br>
        <textarea placeholder="Enter your message" required></textarea><br><br>

        <input type="submit" value="Send">

    </form>

</body>
</html>
