<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photo Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="page-title">Photo Gallery</h1>

  <section class="gallery">

    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500" alt="Mountain landscape">
      <figcaption>Mountain Sunrise</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500" alt="Forest path">
      <figcaption>Forest Trail</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=500" alt="Desert dunes">
      <figcaption>Desert Dunes</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500" alt="Beach shoreline">
      <figcaption>Beach Shoreline</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=500" alt="Mountain lake">
      <figcaption>Alpine Lake</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=500" alt="City skyline">
      <figcaption>City Skyline</figcaption>
    </figure>

  </section>

</body>
</html>
