<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tooltip Demonstration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CSS-Only Tooltips</h1>
  </header>

  <main class="tooltip-wrapper">
    <span class="tooltip-item" data-tooltip="This is a helpful tip!">Hover for a tip</span>
    <span class="tooltip-item" data-tooltip="Settings can be changed here.">⚙ Settings</span>
    <span class="tooltip-item" data-tooltip="Click to save your progress.">💾 Save</span>
    <span class="tooltip-item" data-tooltip="This action cannot be undone.">🗑 Delete</span>
  </main>

  <footer>
    <p>&copy; 2026 Tooltip Practice</p>
  </footer>
</body>
</html>
