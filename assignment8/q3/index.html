<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Showcase</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Image Showcase</h1>
  </header>

  <main class="showcase-grid">
    <figure class="showcase-item">
      <div class="img-wrap"><div class="img-fill" style="background-color:#f87171;"></div></div>
      <figcaption>Crimson Peaks</figcaption>
    </figure>
    <figure class="showcase-item">
      <div class="img-wrap"><div class="img-fill" style="background-color:#fb923c;"></div></div>
      <figcaption>Amber Dunes</figcaption>
    </figure>
    <figure class="showcase-item">
      <div class="img-wrap"><div class="img-fill" style="background-color:#facc15;"></div></div>
      <figcaption>Golden Fields</figcaption>
    </figure>
    <figure class="showcase-item">
      <div class="img-wrap"><div class="img-fill" style="background-color:#4ade80;"></div></div>
      <figcaption>Emerald Woods</figcaption>
    </figure>
    <figure class="showcase-item">
      <div class="img-wrap"><div class="img-fill" style="background-color:#38bdf8;"></div></div>
      <figcaption>Azure Coast</figcaption>
    </figure>
    <figure class="showcase-item">
      <div class="img-wrap"><div class="img-fill" style="background-color:#818cf8;"></div></div>
      <figcaption>Twilight Sky</figcaption>
    </figure>
  </main>

  <footer>
    <p>&copy; 2026 Image Showcase</p>
  </footer>
</body>
</html>
