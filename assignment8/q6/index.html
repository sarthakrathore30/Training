<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Animation Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CSS Animation Demonstration</h1>
  </header>

  <main class="animation-wrapper">
    <div class="anim-item">
      <div class="moving-box"></div>
      <p>Moving Box</p>
    </div>

    <div class="anim-item">
      <div class="bounce-track">
        <div class="bouncing-ball"></div>
      </div>
      <p>Bouncing Ball</p>
    </div>

    <div class="anim-item">
      <p class="color-text">Color Changing Text</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Animation Practice</p>
  </footer>
</body>
</html>
