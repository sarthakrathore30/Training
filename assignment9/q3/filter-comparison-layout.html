<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filter Comparison Layout</title>
<link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>
  <header>
    <h1>Before &amp; After Filter Comparison</h1>
  </header>

  <main class="compare-row">
    <figure class="compare-item">
      <div class="compare-photo original-photo" style="background-color:#38bdf8;"></div>
      <figcaption>Original</figcaption>
    </figure>

    <figure class="compare-item">
      <div class="compare-photo filtered-photo" style="background-color:#38bdf8;"></div>
      <figcaption>Filtered — hover to reveal original</figcaption>
    </figure>
  </main>

  <footer>
    <p>&copy; 2026 Filter Comparison Practice</p>
  </footer>
</body>
</html>
