<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Image Filter Gallery</title>
<link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
  <header>
    <h1>Responsive Image Filter Gallery</h1>
  </header>

  <main class="filter-grid">
    <figure class="filter-item">
      <div class="photo blur-filter" style="background-color:#f87171;"></div>
      <figcaption>Blur</figcaption>
    </figure>
    <figure class="filter-item">
      <div class="photo grayscale-filter" style="background-color:#fb923c;"></div>
      <figcaption>Grayscale</figcaption>
    </figure>
    <figure class="filter-item">
      <div class="photo sepia-filter" style="background-color:#facc15;"></div>
      <figcaption>Sepia</figcaption>
    </figure>
    <figure class="filter-item">
      <div class="photo brightness-filter" style="background-color:#4ade80;"></div>
      <figcaption>Brightness</figcaption>
    </figure>
    <figure class="filter-item">
      <div class="photo contrast-filter" style="background-color:#38bdf8;"></div>
      <figcaption>Contrast</figcaption>
    </figure>
    <figure class="filter-item">
      <div class="photo hue-filter" style="background-color:#818cf8;"></div>
      <figcaption>Hue Rotate</figcaption>
    </figure>
  </main>

  <footer>
    <p>&copy; 2026 Filter Gallery — hover an image to remove its filter</p>
  </footer>
</body>
</html>
